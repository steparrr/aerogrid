name: AeroGrid AI Commander

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: "Numero della task AeroGrid da completare"
        required: true
        default: "05"
        type: string
      objective:
        description: "Istruzioni aggiuntive per Copilot"
        required: false
        default: "Implementa completamente la task rispettando architettura, test e regole del progetto."
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: aerogrid-ai-commander
  cancel-in-progress: false

jobs:
  copilot-command:
    name: Copilot implementa Task ${{ inputs.task_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TASK_ID: ${{ inputs.task_id }}
      OBJECTIVE: ${{ inputs.objective }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AEROGRID_COPILOT_PAT }}

      - name: Verifica configurazione
        env:
          COPILOT_TOKEN: ${{ secrets.AEROGRID_COPILOT_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${COPILOT_TOKEN:-}" ]; then
            echo "::error::Manca il secret AEROGRID_COPILOT_PAT."
            exit 1
          fi

          if ! [[ "$TASK_ID" =~ ^[0-9]{2}$ ]]; then
            echo "::error::La task deve essere indicata con due cifre, esempio: 05."
            exit 1
          fi

      - name: Determina e prepara il branch
        id: task
        run: |
          set -euo pipefail

          BRANCH=""
          TITLE="Task ${TASK_ID}"

          if [ -f issues-log/TASK_STATUS.csv ]; then
            BRANCH="$(awk -F',' -v id="$TASK_ID" \
              'NR > 1 && $1 == id { print $5; exit }' \
              issues-log/TASK_STATUS.csv)"

            FOUND_TITLE="$(awk -F',' -v id="$TASK_ID" \
              'NR > 1 && $1 == id { print $2; exit }' \
              issues-log/TASK_STATUS.csv)"

            if [ -n "$FOUND_TITLE" ]; then
              TITLE="$FOUND_TITLE"
            fi
          fi

          if [ -z "$BRANCH" ]; then
            BRANCH="feature/${TASK_ID}-copilot-command"
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa dipendenze e Copilot CLI
        run: |
          npm ci
          npm install -g @github/copilot

      - name: Copilot prende il comando
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.AEROGRID_COPILOT_PAT }}
        run: |
          set -euo pipefail

          copilot -p "
          Sei il development commander del progetto AeroGrid, un airline tycoon
          realistico sviluppato con React 19, TypeScript, Vite e Vitest.

          Devi completare esclusivamente la Task ${TASK_ID}.

          Obiettivo aggiuntivo:
          ${OBJECTIVE}

          Prima di modificare il codice:
          - leggi AGENTS.md, CLAUDE.md e README.md se presenti;
          - leggi docs/architecture/MVP_ARCHITECTURE.md;
          - leggi docs/architecture/DOMAIN_RULES.md;
          - leggi issues-log/TASK_STATUS.csv se presente;
          - analizza il codice esistente e mantieni gli attuali pattern.

          Regole obbligatorie:
          - una task, un branch, una Pull Request;
          - non modificare workflow, secret o configurazioni GitHub;
          - non ampliare inutilmente lo scope;
          - aggiungi o aggiorna i test;
          - non fare commit, push o merge: saranno gestiti dal workflow;
          - esegui typecheck, lint, build e test;
          - lascia il progetto in uno stato funzionante.
          " \
          --allow-tool=write \
          --allow-tool='shell(npm:*)' \
          --allow-tool='shell(npx:*)' \
          --no-ask-user

      - name: Controlli finali
        id: verification
        continue-on-error: true
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build
          npm run test

      - name: Commit e push
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::Copilot non ha prodotto modifiche."
            exit 1
          fi

          git config user.name "aerogrid-ai-commander"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "feat(task-${TASK_ID}): implement ${{ steps.task.outputs.title }}"
          git push --set-upstream origin "${{ steps.task.outputs.branch }}"

      - name: Crea o aggiorna Pull Request
        env:
          GH_TOKEN: ${{ secrets.AEROGRID_COPILOT_PAT }}
        run: |
          set -euo pipefail

          BRANCH="${{ steps.task.outputs.branch }}"
          TITLE="${{ steps.task.outputs.title }}"
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## AeroGrid AI Commander

          - Task: ${TASK_ID}
          - Titolo: ${TITLE}
          - Branch: ${BRANCH}
          - Controlli finali: ${{ steps.verification.outcome }}

          Implementazione generata da GitHub Copilot CLI.

          La Pull Request deve essere revisionata prima del merge.
          EOF

          if [ -z "$PR_URL" ]; then
            PR_URL="$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Task ${TASK_ID}: ${TITLE}" \
              --body-file "$RUNNER_TEMP/pr-body.md")"
          else
            gh pr comment "$PR_URL" --body-file "$RUNNER_TEMP/pr-body.md"
          fi

          echo "Pull Request: $PR_URL" >> "$GITHUB_STEP_SUMMARY"
